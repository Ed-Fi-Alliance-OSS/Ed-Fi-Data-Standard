[tool.poetry]
name = "json-to-yaml-converter"
version = "1.0.0"
description = "Convert JSON files to YAML format with proper formatting and validation"
authors = ["Ed-Fi Alliance <techsupport@ed-fi.org>"]
readme = "README.md"
packages = [{include = "json_to_yaml.py", format = "sdist"}]

[tool.poetry.dependencies]
python = "^3.8.1"
PyYAML = "^6.0.0"

[tool.poetry.group.dev.dependencies]
black = "^24.3.0"
flake8 = "^6.0.0"
mypy = "^1.5.0"
types-PyYAML = "^6.0.12"

[tool.poetry.scripts]
json-to-yaml = "json_to_yaml:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ["py38"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true