info:
  title: Ed-Fi Operational Data Store API
  description: "The Ed-Fi ODS / API enables applications to read and write education data stored in an Ed-Fi ODS through a secure REST interface. \n***\n > *Note: Consumers of ODS / API information should sanitize all data for display and storage. The ODS / API provides reasonable safeguards against cross-site scripting attacks and other malicious content, but the platform does not and cannot guarantee that the data it contains is free of all potentially harmful content.* \n***\n"
  version: '3'
openapi: 3.0.4
components:
  schemas:
    edFi_academicWeek:
      required:
      - weekIdentifier
      - beginDate
      - endDate
      - totalInstructionalDays
      - schoolReference
      type: object
      properties:
        id:
          type: string
          description: ''
        weekIdentifier:
          maxLength: 80
          minLength: 5
          type: string
          description: The school label for the week.
          x-Ed-Fi-isIdentity: true
        schoolReference:
          $ref: '#/components/schemas/edFi_schoolReference'
        beginDate:
          type: string
          description: 'The start date for the academic week.  Note: Date interpretation may vary. Ed-Fi recommends inclusive dates, but states may define dates as inclusive or exclusive. For calculations, align with local guidelines.'
          format: date
        endDate:
          type: string
          description: 'The end date for the academic week.  Note: Date interpretation may vary. Ed-Fi recommends inclusive dates, but states may define dates as inclusive or exclusive. For calculations, align with local guidelines.'
          format: date
        totalInstructionalDays:
          minimum: 0
          type: integer
          description: The total instructional days during the academic week.
          format: int32
    edFi_academicWeekReference:
      required:
      - schoolId
      - weekIdentifier
      type: object
      properties:
        schoolId:
          type: integer
          description: The identifier assigned to a school. It must be distinct from any other identifier assigned to educational organizations, such as a LocalEducationAgencyId, to prevent duplication.
          format: int64
          x-Ed-Fi-isIdentity: true
        weekIdentifier:
          maxLength: 80
          minLength: 5
          type: string
          description: The school label for the week.
          x-Ed-Fi-isIdentity: true
        link:
          $ref: '#/components/schemas/link'
    edFi_accountabilityRating:
      required:
      - ratingTitle
      - rating
      - educationOrganizationReference
      - schoolYearTypeReference
      type: object
      properties:
        id:
          type: string
          description: ''
        ratingTitle:
          maxLength: 60
          type: string
          description: The title of the rating.
          x-Ed-Fi-isIdentity: true
        educationOrganizationReference:
          $ref: '#/components/schemas/edFi_educationOrganizationReference'
        schoolYearTypeReference:
          $ref: '#/components/schemas/edFi_schoolYearTypeReference'
        rating:
          maxLength: 35
          type: string
          description: An accountability rating level, designation, or assessment.
        ratingDate:
          type: string
          description: The date the rating was awarded.
          format: date
          x-nullable: true
        ratingOrganization:
          maxLength: 35
          type: string
          description: The organization that assessed the rating.
          x-nullable: true
        ratingProgram:
          maxLength: 30
          type: string
          description: The program associated with the accountability rating (e.g., NCLB, AEIS).
          x-nullable: true
    edFi_applicantProfile:
      required:
      - applicantProfileIdentifier
      - firstName
      - lastSurname
      type: object
      properties:
        id:
          type: string
          description: ''
        applicantProfileIdentifier:
          maxLength: 32
          minLength: 1
          type: string
          description: Identifier assigned to a person making formal application for entrance into a program or an open staff position.
          x-Ed-Fi-isIdentity: true
        addresses:
          type: array
          items:
            $ref: '#/components/schemas/edFi_applicantProfileAddress'
          description: An unordered collection of applicantProfileAddresses. The set of elements that describes an address, including the street address, city, state, and ZIP code.
        applicantCharacteristics:
          type: array
          items:
            $ref: '#/components/schemas/edFi_applicantProfileApplicantCharacteristic'
          description: An unordered collection of applicantProfileApplicantCharacteristics. Reflects important characteristics of the applicant's home situation.
        backgroundChecks:
          type: array
          items:
            $ref: '#/components/schemas/edFi_applicantProfileBackgroundCheck'
          description: An unordered collection of applicantProfileBackgroundChecks. Applicant background check history and disposition.
        birthDate:
          type: string
          description: The month, day, and year on which an individual was born.
          format: date
          x-nullable: true
        citizenshipStatusDescriptor:
          maxLength: 306
          type: string
          description: An indicator of whether or not the person is a U.S. citizen.
          x-nullable: true
        disabilities:
          type: array
          items:
            $ref: '#/components/schemas/edFi_applicantProfileDisability'
          description: An unordered collection of applicantProfileDisabilities. The disability condition(s) that best describes an individual's impairment.
        economicDisadvantageDescriptor:
          maxLength: 306
          type: string
          description: An indication of inadequate financial condition of an individual's family, as determined by family income, number of family members/dependents, participation in public assistance programs, and/or other characteristics considered relevant by federal, state, and local policy.
          x-nullable: true
        educatorPreparationProgramNames:
          type: array
          items:
            $ref: '#/components/schemas/edFi_applicantProfileEducatorPreparationProgramName'
          description: An unordered collection of applicantProfileEducatorPreparationProgramNames. The teacher preparation program(s) completed by the teacher.
        electronicMails:
          type: array
          items:
            $ref: '#/components/schemas/edFi_applicantProfileElectronicMail'
          description: An unordered collection of applicantProfileElectronicMails. The numbers, letters, and symbols used to identify an electronic mail (e-mail) user within the network to which the individual or organization belongs.
        firstGenerationStudent:
          type: boolean
          description: Indicator of whether individual is a first generation college student.
          x-nullable: true
        firstName:
          maxLength: 75
          type: string
          description: A name given to an individual at birth, baptism, or during another naming ceremony, or through legal change.
        genderIdentity:
          maxLength: 60
          type: string
          description: The gender the person identifies themselves as.
          x-nullable: true
        generationCodeSuffix:
          maxLength: 10
          type: string
          description: An appendage, if any, used to denote an individual's generation in his family (e.g., Jr., Sr., III).
          x-nullable: true
        gradePointAverages:
          type: array
          items:
            $ref: '#/components/schemas/edFi_applicantProfileGradePointAverage'
          description: An unordered collection of applicantProfileGradePointAverages. Data that provides information on a measure of average performance in a group of courses taken by an individual.
        highestCompletedLevelOfEducationDescriptor:
          maxLength: 306
          type: string
          description: The extent of formal instruction an individual has received.
          x-nullable: true
        highlyQualifiedAcademicSubjects:
          type: array
          items:
            $ref: '#/components/schemas/edFi_applicantProfileHighlyQualifiedAcademicSubject'
          description: An unordered collection of applicantProfileHighlyQualifiedAcademicSubjects. The academic subject(s) in which the staff is deemed to be "highly qualified".
        highlyQualifiedTeacher:
          type: boolean
          description: An indication of whether a teacher is classified as highly qualified for his/her assignment according to state definition. This attribute indicates the teacher is highly qualified for all sections being taught.
          x-nullable: true
        hispanicLatinoEthnicity:
          type: boolean
          description: An indication that the individual traces his or her origin or descent to Mexico, Puerto Rico, Cuba, Central, and South America, and other Spanish cultures, regardless of race. The term, "Spanish origin," can be used in addition to "Hispanic or Latino".
          x-nullable: true
          x-Ed-Fi-isDeprecated: true
          x-Ed-Fi-deprecatedReasons: This element is scheduled for removal by 2029. Users of this element are advised to use Race instead.
        identificationDocuments:
          type: array
          items:
            $ref: '#/components/schemas/edFi_applicantProfileIdentificationDocument'
          description: An unordered collection of applicantProfileIdentificationDocuments. Describe the documentation of citizenship.
        internationalAddresses:
          type: array
          items:
            $ref: '#/components/schemas/edFi_applicantProfileInternationalAddress'
          description: An unordered collection of applicantProfileInternationalAddresses. The set of elements that describes an international address.
        languages:
          type: array
          items:
            $ref: '#/components/schemas/edFi_applicantProfileLanguage'
          description: An unordered collection of applicantProfileLanguages. The language(s) the individual uses to communicate.
        lastSurname:
          maxLength: 75
          type: string
          description: The name borne in common by members of a family.
        maidenName:
          maxLength: 75
          type: string
          description: The individual's maiden name.
          x-nullable: true
        middleName:
          maxLength: 75
          type: string
          description: A secondary name given to an individual at birth, baptism, or during another naming ceremony.
          x-nullable: true
        personalIdentificationDocuments:
          type: array
          items:
            $ref: '#/components/schemas/edFi_applicantProfilePersonalIdentificationDocument'
          description: 'An unordered collection of applicantProfilePersonalIdentificationDocuments. The documents presented as evident to verify one''s personal identity; for example: drivers license, passport, birth certificate, etc.'
        personalTitlePrefix:
          maxLength: 30
          type: string
          description: A prefix used to denote the title, degree, position, or seniority of the individual.
          x-nullable: true
        preferredFirstName:
          maxLength: 75
          type: string
          description: The first name the individual prefers, if different from their legal first name
          x-nullable: true
        preferredLastSurname:
          maxLength: 75
          type: string
          description: The last name the individual prefers, if different from their legal last name
          x-nullable: true
        races:
          type: array
          items:
            $ref: '#/components/schemas/edFi_applicantProfileRace'
          description: An unordered collection of applicantProfileRaces. The general racial category which most clearly reflects the individual's recognition of his or her community or with which the individual most identifies. The way this data element is listed, it must allow for multiple entries so that each individual can specify all appropriate races.
        sexDescriptor:
          maxLength: 306
          type: string
          description: A person's birth sex.
          x-nullable: true
        telephones:
          type: array
          items:
            $ref: '#/components/schemas/edFi_applicantProfileTelephone'
          description: An unordered collection of applicantProfileTelephones. The 10-digit telephone number, including the area code, for the person.
        visas:
          type: array
          items:
            $ref: '#/components/schemas/edFi_applicantProfileVisa'
          description: An unordered collection of applicantProfileVisas. An indicator of a non-US citizen's Visa type.
        yearsOfPriorProfessionalExperience:
          maximum: 999.99
          minimum: -999.99
          type: number
          description: The total number of years that an individual has previously held a similar professional position in one or more education institutions.
          format: double
          x-nullable: true
        yearsOfPriorTeachingExperience:
          maximum: 999.99
          minimum: -999.99
          type: number
          description: The total number of years that an individual has previously held a teaching position in one or more education institutions.
          format: double
          x-nullable: true
    edFi_applicantProfileAddress:
      required:
      - addressTypeDescriptor
      - stateAbbreviationDescriptor
      - city
      - postalCode
      - streetNumberName
      type: object
      properties:
        addressTypeDescriptor:
          maxLength: 306
          type: string
          description: 'The type of address listed for an individual or organization.    For example:  Physical Address, Mailing Address, Home Address, etc.)'
          x-Ed-Fi-isIdentity: true
        stateAbbreviationDescriptor:
          maxLength: 306
          type: string
          description: The abbreviation for the state (within the United States) or outlying area in which an address is located.
          x-Ed-Fi-isIdentity: true
        city:
          maxLength: 30
          minLength: 2
          type: string
          description: The name of the city in which an address is located.
          x-Ed-Fi-isIdentity: true
        postalCode:
          maxLength: 17
          type: string
          description: The five or nine digit zip code or overseas postal code portion of an address.
          x-Ed-Fi-isIdentity: true
        streetNumberName:
          maxLength: 150
          type: string
          description: The street number and street name or post office box number of an address.
          x-Ed-Fi-isIdentity: true
        localeDescriptor:
          maxLength: 306
          type: string
          description: A general geographic indicator that categorizes U.S. territory (e.g., City, Suburban).
          x-nullable: true
        apartmentRoomSuiteNumber:
          maxLength: 50
          type: string
          description: The apartment, room, or suite number of an address.
          x-nullable: true
        buildingSiteNumber:
          maxLength: 20
          type: string
          description: The number of the building on the site, if more than one building shares the same address.
          x-nullable: true
        congressionalDistrict:
          maxLength: 30
          type: string
          description: The congressional district in which an address is located.
          x-nullable: true
        countyFIPSCode:
          maxLength: 5
          minLength: 3
          type: string
          description: The Federal Information Processing Standards (FIPS) numeric code for the county issued by the National Institute of Standards and Technology (NIST). Counties are considered to be the "first-order subdivisions" of each State and statistically equivalent entity, regardless of their local designations (county, parish, borough, etc.) Counties in different States will have the same code. A unique county number is created when combined with the 2-digit FIPS State Code.
          x-nullable: true
        doNotPublishIndicator:
          type: boolean
          description: An indication that the address should not be published.
          x-nullable: true
        latitude:
          maxLength: 20
          type: string
          description: The geographic latitude of the physical address.
          x-nullable: true
        longitude:
          maxLength: 20
          type: string
          description: The geographic longitude of the physical address.
          x-nullable: true
        nameOfCounty:
          maxLength: 30
          type: string
          description: The name of the county, parish, borough, or comparable unit (within a state) in which an address is located.
          x-nullable: true
        periods:
          type: array
          items:
            $ref: '#/components/schemas/edFi_applicantProfileAddressPeriod'
          description: An unordered collection of applicantProfileAddressPeriods. The time periods for which the address is valid. For physical addresses, the periods in which the person lived at that address.
    edFi_applicantProfileAddressPeriod:
      required:
      - beginDate
      type: object
      properties:
        beginDate:
          type: string
          description: 'The month, day, and year for the start of the period.  Note: Date interpretation may vary. Ed-Fi recommends inclusive dates, but states may define dates as inclusive or exclusive. For calculations, align with local guidelines.'
          format: date
          x-Ed-Fi-isIdentity: true
        endDate:
          type: string
          description: 'The month, day, and year for the end of the period.  Note: Date interpretation may vary. Ed-Fi recommends inclusive dates, but states may define dates as inclusive or exclusive. For calculations, align with local guidelines.'
          format: date
          x-nullable: true
    edFi_applicantProfileApplicantCharacteristic:
      required:
      - studentCharacteristicDescriptor
      type: object
      properties:
        studentCharacteristicDescriptor:
          maxLength: 306
          type: string
          description: The characteristic designated for the student applicant.
          x-Ed-Fi-isIdentity: true
        beginDate:
          type: string
          description: 'The date the characteristic was designated. Note: Date interpretation may vary. Ed-Fi recommends inclusive dates, but states may define dates as inclusive or exclusive. For calculations, align with local guidelines.'
          format: date
          x-nullable: true
        designatedBy:
          maxLength: 60
          type: string
          description: The person, organization, or department that designated the characteristic.
          x-nullable: true
        endDate:
          type: string
          description: 'The date the characteristic was removed. Note: Date interpretation may vary. Ed-Fi recommends inclusive dates, but states may define dates as inclusive or exclusive. For calculations, align with local guidelines.'
          format: date
          x-nullable: true
    edFi_applicantProfileBackgroundCheck:
      required:
      - backgroundCheckTypeDescriptor
      - backgroundCheckRequestedDate
      type: object
      properties:
        backgroundCheckTypeDescriptor:
          maxLength: 306
          type: string
          description: The type of background check.
          x-Ed-Fi-isIdentity: true
        backgroundCheckStatusDescriptor:
          maxLength: 306
          type: string
          description: The status of the background check.
          x-nullable: true
        backgroundCheckCompletedDate:
          type: string
          description: The date the background check was completed.
          format: date
          x-nullable: true
        backgroundCheckRequestedDate:
          type: string
          description: The date the background check was requested.
          format: date
        fingerprint:
          type: boolean
          description: Indicates that a person has or has not completed a fingerprint.
          x-nullable: true
    edFi_applicantProfileDisability:
      required:
      - disabilityDescriptor
      type: object
      properties:
        disabilityDescriptor:
          maxLength: 306
          type: string
          description: A disability category that describes a individual's impairment.
          x-Ed-Fi-isIdentity: true
        disabilityDeterminationSourceTypeDescriptor:
          maxLength: 306
          type: string
          description: The source that provided the disability determination.
          x-nullable: true
        disabilityDiagnosis:
          maxLength: 80
          type: string
          description: A description of the disability diagnosis.
          x-nullable: true
        orderOfDisability:
          type: integer
          description: 'The order by severity of individual''s disabilities: 1- Primary, 2 -  Secondary, 3 - Tertiary, etc.'
          format: int32
          x-nullable: true
        designations:
          type: array
          items:
            $ref: '#/components/schemas/edFi_applicantProfileDisabilityDesignation'
          description: An unordered collection of applicantProfileDisabilityDesignations. Whether the disability is IDEA, Section 504, or other disability designation.
    edFi_applicantProfileDisabilityDesignation:
      required:
      - disabilityDesignationDescriptor
      type: object
      properties:
        disabilityDesignationDescriptor:
          maxLength: 306
          type: string
          description: Whether the disability is IDEA, Section 504, or other disability designation.
          x-Ed-Fi-isIdentity: true
    edFi_applicantProfileEducatorPreparationProgramName:
      required:
      - educatorPreparationProgramName
      type: object
      properties:
        educatorPreparationProgramName:
          maxLength: 255
          minLength: 1
          type: string
          description: The teacher preparation program(s) completed by the teacher.
          x-Ed-Fi-isIdentity: true
    edFi_applicantProfileElectronicMail:
      required:
      - electronicMailTypeDescriptor
      - electronicMailAddress
      type: object
      properties:
        electronicMailTypeDescriptor:
          maxLength: 306
          type: string
          description: 'The type of email listed for an individual or organization. For example: Home/Personal, Work, etc.)'
          x-Ed-Fi-isIdentity: true
        electronicMailAddress:
          maxLength: 128
          minLength: 7
          type: string
          description: The electronic mail (e-mail) address listed for an individual or organization.
          x-Ed-Fi-isIdentity: true
        doNotPublishIndicator:
          type: boolean
          description: An indication that the electronic email address should not be published.
          x-nullable: true
        primaryEmailAddressIndicator:
          type: boolean
          description: An indication that the electronic mail address should be used as the principal electronic mail address for an individual or organization.
          x-nullable: true
    edFi_applicantProfileGradePointAverage:
      required:
      - gradePointAverageTypeDescriptor
      - gradePointAverageValue
      type: object
      properties:
        gradePointAverageTypeDescriptor:
          maxLength: 306
          type: string
          description: The system used for calculating the grade point average for an individual.
          x-Ed-Fi-isIdentity: true
        gradePointAverageValue:
          maximum: 100000000000000.0
          minimum: 0.0
          type: number
          description: The value of the grade points earned divided by the number of credits attempted.
          format: double
        isCumulative:
          type: boolean
          description: Indicator of whether or not the Grade Point Average value is cumulative.
          x-nullable: true
        maxGradePointAverageValue:
          maximum: 100000000000000.0
          minimum: 0.0
          type: number
          description: The maximum value for the grade point average.
          format: double
          x-nullable: true
    edFi_applicantProfileHighlyQualifiedAcademicSubject:
      required:
      - academicSubjectDescriptor
      type: object
      properties:
        academicSubjectDescriptor:
          maxLength: 306
          type: string
          description: The academic subject(s) in which the staff is deemed to be "highly qualified".
          x-Ed-Fi-isIdentity: true
    edFi_applicantProfileIdentificationDocument:
      required:
      - identificationDocumentUseDescriptor
      - personalInformationVerificationDescriptor
      type: object
      properties:
        identificationDocumentUseDescriptor:
          maxLength: 306
          type: string
          description: The primary function of the document used for establishing identity.
          x-Ed-Fi-isIdentity: true
        personalInformationVerificationDescriptor:
          maxLength: 306
          type: string
          description: The category of the document relative to its purpose.
          x-Ed-Fi-isIdentity: true
        issuerCountryDescriptor:
          maxLength: 306
          type: string
          description: Country of origin of the document. It is strongly recommended that entries use only ISO 3166 2-letter country codes.
          x-nullable: true
        documentExpirationDate:
          type: string
          description: The day when the document  expires, if null then never expires.
          format: date
          x-nullable: true
        documentTitle:
          maxLength: 60
          type: string
          description: The title of the document given by the issuer.
          x-nullable: true
        issuerDocumentIdentificationCode:
          maxLength: 120
          type: string
          description: The unique identifier on the issuer's identification system.
          x-nullable: true
        issuerName:
          maxLength: 150
          type: string
          description: Name of the entity or institution that issued the document.
          x-nullable: true
    edFi_applicantProfileInternationalAddress:
      required:
      - addressTypeDescriptor
      - countryDescriptor
      - addressLine1
      type: object
      properties:
        addressTypeDescriptor:
          maxLength: 306
          type: string
          description: 'The type of address listed for an individual or organization. For example:  Physical Address, Mailing Address, Home Address, etc.)'
          x-Ed-Fi-isIdentity: true
        countryDescriptor:
          maxLength: 306
          type: string
          description: The name of the country. It is strongly recommended that entries use only ISO 3166 2-letter country codes.
        addressLine1:
          maxLength: 150
          type: string
          description: The first line of the address.
        addressLine2:
          maxLength: 150
          type: string
          description: The second line of the address.
          x-nullable: true
        addressLine3:
          maxLength: 150
          type: string
          description: The third line of the address.
          x-nullable: true
        addressLine4:
          maxLength: 150
          type: string
          description: The fourth line of the address.
          x-nullable: true
        beginDate:
          type: string
          description: 'The first date the address is valid. For physical addresses, the date the individual moved to that address.  Note: Date interpretation may vary. Ed-Fi recommends inclusive dates, but states may define dates as inclusive or exclusive. For calculations, align with local guidelines.'
          format: date
          x-nullable: true
        endDate:
          type: string
          description: 'The last date the address is valid. For physical addresses, the date the individual moved from that address.  Note: Date interpretation may vary. Ed-Fi recommends inclusive dates, but states may define dates as inclusive or exclusive. For calculations, align with local guidelines.'
          format: date
          x-nullable: true
        latitude:
          maxLength: 20
          type: string
          description: The geographic latitude of the physical address.
          x-nullable: true
        longitude:
          maxLength: 20
          type: string
          description: The geographic longitude of the physical address.
          x-nullable: true
    edFi_applicantProfileLanguage:
      required:
      - languageDescriptor
      type: object
      properties:
        languageDescriptor:
          maxLength: 306
          type: string
          description: A specification of which written or spoken communication is being used.
          x-Ed-Fi-isIdentity: true
        uses:
          type: array
          items:
            $ref: '#/components/schemas/edFi_applicantProfileLanguageUse'
          description: An unordered collection of applicantProfileLanguageUses. A description of how the language is used (e.g. Home Language, Native Language, Spoken Language).
    edFi_applicantProfileLanguageUse:
      required:
      - languageUseDescriptor
      type: object
      properties:
        languageUseDescriptor:
          maxLength: 306
          type: string
          description: A description of how the language is used (e.g. Home Language, Native Language, Spoken Language).
          x-Ed-Fi-isIdentity: true
    edFi_applicantProfilePersonalIdentificationDocument:
      required:
      - identificationDocumentUseDescriptor
      - personalInformationVerificationDescriptor
      type: object
      properties:
        identificationDocumentUseDescriptor:
          maxLength: 306
          type: string
          description: The primary function of the document used for establishing identity.
          x-Ed-Fi-isIdentity: true
        personalInformationVerificationDescriptor:
          maxLength: 306
          type: string
          description: The category of the document relative to its purpose.
          x-Ed-Fi-isIdentity: true
        issuerCountryDescriptor:
          maxLength: 306
          type: string
          description: Country of origin of the document. It is strongly recommended that entries use only ISO 3166 2-letter country codes.
          x-nullable: true
        documentExpirationDate:
          type: string
          description: The day when the document  expires, if null then never expires.
          format: date
          x-nullable: true
        documentTitle:
          maxLength: 60
          type: string
          description: The title of the document given by the issuer.
          x-nullable: true
        issuerDocumentIdentificationCode:
          maxLength: 120
          type: string
          description: The unique identifier on the issuer's identification system.
          x-nullable: true
        issuerName:
          maxLength: 150
          type: string
          description: Name of the entity or institution that issued the document.
          x-nullable: true
    edFi_applicantProfileRace:
      required:
      - raceDescriptor
      type: object
      properties:
        raceDescriptor:
          maxLength: 306
          type: string
          description: The general racial category which most clearly reflects the individual's recognition of his or her community or with which the individual most identifies. The way this data element is listed, it must allow for multiple entries so that each individual can specify all appropriate races.
          x-Ed-Fi-isIdentity: true
    edFi_applicantProfileReference:
      required:
      - applicantProfileIdentifier
      type: object
      properties:
        applicantProfileIdentifier:
          maxLength: 32
          minLength: 1
          type: string
          description: Identifier assigned to a person making formal application for entrance into a program or an open staff position.
          x-Ed-Fi-isIdentity: true
        link:
          $ref: '#/components/schemas/link'
    edFi_applicantProfileTelephone:
      required:
      - telephoneNumberTypeDescriptor
      - telephoneNumber
      type: object
      properties:
        telephoneNumberTypeDescriptor:
          maxLength: 306
          type: string
          description: The type of communication number listed for an individual or organization.
          x-Ed-Fi-isIdentity: true
        telephoneNumber:
          maxLength: 24
          type: string
          description: The telephone number including the area code, and extension, if applicable.
          x-Ed-Fi-isIdentity: true
        doNotPublishIndicator:
          type: boolean
          description: An indication that the telephone number should not be published.
          x-nullable: true
        orderOfPriority:
          minimum: 1
          type: integer
