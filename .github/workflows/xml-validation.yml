name: XML Validation

on:
  pull_request:
    branches:
      - v6.0.0
    paths:
      - '**/*.xml'
      - '**/*.xsd'
    types:
      - opened
      - reopened
      - edited

permissions:
  contents: read
  pull-requests: write

jobs:
  validate-xml:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./eng

    steps:
    - name: Checkout code
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: Install Poetry
      run: pipx install poetry

    - name: Set up Python 3.12
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: '3.12'
        cache: "poetry"

    - name: Install dependencies
      run: poetry env use "3.12" && poetry install

    - name: Run XML validation
      id: validation
      run: |
        # Validate the samples directory
        poetry run python validate_xml.py > validation_output.txt 2>&1

        # save exit code to a variable
        exit_code=$?

        # validate the Descriptors directory
        poetry run python validate_xml.py --samples-dir eng/testing/Descriptors > validation_output.txt 2>&1

        # echo the combined exit code
        echo "exit_code=$((exit_code + $?))" >> $GITHUB_OUTPUT
      continue-on-error: true

    - name: Read validation output
      id: read_output
      run: |
        if [ -f validation_output.txt ]; then
          {
            echo 'validation_output<<EOF'
            cat validation_output.txt
            echo EOF
          } >> $GITHUB_OUTPUT
        else
          echo 'validation_output=No output file found' >> $GITHUB_OUTPUT
        fi

    - name: Comment on PR
      uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea #v7.0.1
      with:
        script: |
          const output = `${{ steps.read_output.outputs.validation_output }}`;
          const exitCode = '${{ steps.validation.outputs.exit_code }}';

          let commentBody;
          if (exitCode === '0') {
            commentBody = `## ✅ XML Validation Passed

          All XML files have been validated successfully against their schemas and descriptor definitions.

          <details>
          <summary>Validation Output</summary>

          \`\`\`
          ${output}
          \`\`\`

          </details>`;
          } else {
            commentBody = `## ❌ XML Validation Failed

          XML validation found errors. Please review and fix the issues below:

          <details>
          <summary>Validation Errors</summary>

          \`\`\`
          ${output}
          \`\`\`

          </details>

          ### Error Format
          Errors are formatted as: \`[file name]\t[line number]\t[validation error]\`

          ### Next Steps
          1. Review the validation errors above
          2. Fix the XML schema validation errors and/or descriptor reference errors
          3. Push your changes to trigger validation again`;
          }

          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: commentBody
          });

    - name: Fail if validation errors found
      if: steps.validation.outputs.exit_code != '0'
      run: |
        echo "XML validation failed with exit code ${{ steps.validation.outputs.exit_code }}"
        exit 1
